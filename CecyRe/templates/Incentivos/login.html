{% extends 'Incentivos/base.html' %}

{% block title %}Iniciar Sesión - Incentivos{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="eco-card">
            <div class="card-header-eco text-center">
                <i class="fas fa-gift fa-3x mb-3"></i>
                <h3 class="mb-0">Iniciar Sesión</h3>
            </div>
            
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Nombre de usuario</label>
                        <input type="text" name="username" id="username" 
                               class="form-control form-control-eco" 
                               placeholder="Ingresa tu usuario" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="password" 
                               class="form-control form-control-eco" 
                               placeholder="Ingresa tu contraseña" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-eco">
                            <i class="fas fa-sign-in-alt"></i> Ingresar
                        </button>
                        
                        <a href="{% url 'Incentivos:registro' %}" class="btn btn-eco-secondary">
                            <i class="fas fa-user-plus"></i> Crear cuenta nueva
                        </a>
                        
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Volver al MarketPlace
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
